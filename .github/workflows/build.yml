name: deploy-ghcr

permissions:
  contents: read
  packages: write

on:
  push:
    # branches: [master]
    tags:
      - '*'
  workflow_dispatch:

jobs:
  deploy-docker:
    name: Deploy GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get dev branch short SHA
        id: get_dev_sha
        run: |
          set -e
          if git ls-remote --heads origin dev >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin dev
            sha=$(git rev-parse --short origin/dev)
          else
            sha=""
          fi
          echo "dev_short_sha=$sha" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mrdynamo/twitch-channel-points-miner-v2
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=dev-{{short_sha}},enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=build-${{ steps.get_dev_sha.outputs.dev_short_sha }},enable=${{ steps.get_dev_sha.outputs.dev_short_sha != '' }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: BUILDX_QEMU_ENV=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
